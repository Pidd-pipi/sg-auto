<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>任务监看 · sologsb 调度台</title>
  <link rel="stylesheet" href="/static/app.css?v=20260922-log-columns">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail-brand">
      <div class="rail-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="rail-brand-text">
        <p>sologsb</p>
        <h1>调度台</h1>
      </div>
    </div>
    <nav class="rail-nav">
      <a href="/" class="active">监看<span class="count" id="navTasks">0</span></a>
      <a href="/tasks">队列<span class="count" id="navQueue">0</span></a>
      <a href="/settings">设置</a>
      <a href="/logs">日志</a>
    </nav>
    <div class="rail-section">
      <span class="rail-label">默认文件夹</span>
      <select class="input" id="folderSelect"></select>
      <span class="rail-label">调度模式</span>
      <button class="mode-toggle" id="modeBadge" type="button" data-mode="containers"><span class="dot"></span>容器优先</button>
    </div>
    <div class="rail-foot">
      <button class="btn ghost sm" id="themeBtn" type="button">切换主题</button>
      <div class="sync" id="sync"><span class="dot"></span><span id="syncText">连接中</span></div>
      <div class="link" id="folderPath"></div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div class="head-title">任务监看<small id="headMeta"></small></div>
      <div class="head-spacer"></div>
      <div class="head-tools">
        <button class="btn" id="refreshBtn" type="button">刷新</button>
      </div>
    </header>

    <div class="band" id="band"></div>

    <div class="filters">
      <input class="input search" id="searchInput" type="search" placeholder="搜索任务名 / 项目编号 / 任务号" autocomplete="off">
      <span class="cell" id="scopeHint"></span>
      <div class="segmented" id="filterRow">
        <button type="button" data-filter="all" class="active">全部<span class="n" data-count="all">0</span></button>
        <button type="button" data-filter="running">运行中<span class="n" data-count="running">0</span></button>
        <button type="button" data-filter="waiting">等待中<span class="n" data-count="waiting">0</span></button>
        <button type="button" data-filter="attention">需处理<span class="n" data-count="attention">0</span></button>
        <button type="button" data-filter="finished">已完成<span class="n" data-count="finished">0</span></button>
        <button type="button" data-filter="failed">失败<span class="n" data-count="failed">0</span></button>
      </div>
    </div>

    <div class="list" id="list">
      <div class="list-head">
        <span></span>
        <span>状态</span>
        <span>任务</span>
        <span class="hide-sm">项目</span>
        <span class="hide-sm">阶段</span>
        <span class="hide-sm">侧 / 候选</span>
        <span class="num">容器</span>
        <span class="num">更新</span>
        <span></span>
      </div>
      <div id="rows"></div>
      <div class="empty" id="emptyState" hidden></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head">
    <div class="modal-title" id="modalTitle">—</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-tools">
      <button class="btn" id="copyPathBtn" type="button">复制目录</button>
      <button class="btn danger" id="dismissBtn" type="button">放弃监控</button>
      <button class="btn ghost" id="closeModalBtn" type="button">关闭</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button type="button" data-tab="overview" class="active">概览</button>
    <button type="button" data-tab="logs">运行日志</button>
    <button type="button" data-tab="prompt">提示词</button>
  </div>
  <div class="modal-body">
    <div class="pane" id="pane-overview"></div>
    <div class="pane" id="pane-logs" hidden>
      <div class="filters" style="position:static;padding:0 0 10px;border:0;background:none">
        <div class="segmented" id="logKindRow">
          <button type="button" data-kind="" class="active">全部</button>
          <button type="button" data-kind="tool">工具</button>
          <button type="button" data-kind="assistant">输出</button>
          <button type="button" data-kind="error">错误</button>
          <button type="button" data-kind="thinking">思考</button>
        </div>
        <span class="cell" id="logMeta"></span>
        <button class="btn ghost sm" id="logRefreshBtn" type="button">刷新</button>
      </div>
      <div class="logbox">
        <div class="logbox-head"><div><strong>候选日志</strong><span id="logCount"></span></div></div>
        <div class="logstreams" id="logStreams"></div>
      </div>
    </div>
    <div class="pane" id="pane-prompt" hidden>
      <pre class="prose" id="promptText"></pre>
    </div>
  </div>
</div>
</div>

<script src="/static/app.js?v=20260922-log-columns"></script>
<script>
  const { $, $$, esc, debounce, fetchJson, postJson, fmtDuration, fmtAge, fmtClock, toast,
          initTheme, renderRail, renderMetrics, connectStream, renderKeyed, setText, setHtml, setAttr } = window.SoloApp;

  const STATUS_LABELS = {
    prepared: "已接入", prompt_ready: "提示词就绪", repo_ready: "仓库就绪", running: "执行中",
    candidates_running: "候选竞速中", candidates_ready: "候选竞速结束", a_staged: "A 已校验",
    b_staged: "B 已校验", semantic_review_required: "待语义审核", ab_clean: "A/B 已发布",
    verified: "已验证", gsb_ready: "GSB 就绪", recorded: "已录屏", complete: "已完成",
    attempt_invalid: "本轮无效", blocked: "已阻断", staged: "已校验", clean: "已发布",
    invalidated: "已作废", cancelled: "未进前二", idle: "未启动",
  };
  const BUCKET_LABELS = { waiting: "等待中", running: "运行中", attention: "需处理", finished: "已完成", failed: "失败" };
  const BADGE_STATE_LABELS = { running: "执行中", done: "已完成", failed: "失败", idle: "未启动", cancelled: "已停止" };

  const state = {
    data: null, tasks: [], byId: new Map(),
    query: "", filter: "all", selectedId: null, detail: null,
    tab: "overview", logKind: "", logTimer: null, logSeq: 0, logKeys: "",
    connected: false, error: "",
  };

  initTheme();

  /* ---------------------------------------------------------------- helpers */
  function selectedIdFromUrl() {
    return new URLSearchParams(location.search).get("task") || localStorage.getItem("sologsb-selected-task") || "";
  }
  function persistSelected(id) {
    if (id) localStorage.setItem("sologsb-selected-task", id);
    else localStorage.removeItem("sologsb-selected-task");
    const url = new URL(location.href);
    if (id) url.searchParams.set("task", id); else url.searchParams.delete("task");
    history.replaceState({}, "", `${url.pathname}${url.search}`);
  }
  function badgeTitle(badge) {
    const key = String(badge.key || "");
    const label = key.startsWith("candidate-")
      ? `${key}${badge.label && badge.label !== key.split("-")[1] ? ` → ${badge.label}` : ""}`
      : `${key} 侧`;
    return `${label} · ${BADGE_STATE_LABELS[badge.state] || badge.state || "未启动"}`;
  }
  function visibleTasks() {
    const query = state.query.trim().toLowerCase();
    return state.tasks.filter((task) => {
      if (query) {
        const hay = [task.name, task.projectCode, task.projectName, task.taskNo, task.taskType].join(" ").toLowerCase();
        if (!hay.includes(query)) return false;
      }
      if (state.filter !== "all" && task.bucket !== state.filter) return false;
      return true;
    });
  }

  /* ------------------------------------------------------------------- rows */
  function renderRow(node, task) {
    let changed = false;
    changed = setAttr(node, "data-bucket", task.bucket) || changed;
    changed = setAttr(node, "data-id", task.id) || changed;
    node.classList.toggle("selected", task.id === state.selectedId);
    if (node.dataset.built !== "1") {
      node.className = "row";
      node.innerHTML = `
        <span class="rail-mark-cell"></span>
        <span class="state" title=""></span>
        <div class="cell-name">
          <span class="n"></span>
          <span class="cell-sub"></span>
        </div>
        <div class="cell hide-sm"></div>
        <div class="cell hide-sm phase"></div>
        <div class="cell-badges hide-sm"></div>
        <div class="cell num"></div>
        <div class="cell time"></div>
        <button class="row-x" type="button" title="从监看列表移除">✕</button>`;
      node.dataset.built = "1";
      node.addEventListener("click", () => openTask(task.id));
      node.querySelector(".row-x").addEventListener("click", (event) => {
        event.stopPropagation();
        quickDismiss(task);
      });
    }
    const [rail, stateCell, name, sub, project, phase, badges, containers, updated] =
      $$(".rail-mark-cell, .state, .cell-name .n, .cell-name .cell-sub, .cell, .phase, .cell-badges, .cell.num, .cell.time", node);
    const stateLabel = BUCKET_LABELS[task.bucket] || task.bucket || "—";
    changed = setText(stateCell, stateLabel) || changed;
    changed = setAttr(stateCell, "data-state", task.bucket) || changed;
    changed = setAttr(stateCell, "title", `${stateLabel} · ${task.statusLabel || task.status}`) || changed;
    changed = setText(name, task.name) || changed;
    const bits = [task.projectCode, task.taskType, task.difficulty].filter(Boolean).join(" · ");
    changed = setText(sub, bits || "—") || changed;
    changed = setText(project, task.projectName || task.projectCode || "—") || changed;
    changed = setHtml(phase, `<span>${esc(task.phase || "—")}</span>`) || changed;
    changed = setHtml(badges, (task.badges || []).map((badge) => (
      `<span class="tag" data-state="${esc(badge.state)}" data-side="${esc(badge.key)}" title="${esc(badgeTitle(badge))}">${esc(badge.label)}</span>`
    )).join("")) || changed;
    changed = setText(containers, String(task.activeContainers || 0)) || changed;
    changed = setText(updated, fmtClock(task.updatedAt)) || changed;
    return changed;
  }

  function renderRows() {
    const items = visibleTasks();
    renderKeyed($("#rows"), items, renderRow, (task) => task.id);
    $("#emptyState").hidden = items.length > 0;
    if (!items.length) {
      setText($("#emptyState"), state.tasks.length
        ? `没有符合「${BUCKET_LABELS[state.filter] || "该筛选"}」条件的任务。`
        : "未发现 sologsb 任务。");
    }
    const counts = { all: state.tasks.length, waiting: 0, running: 0, attention: 0, finished: 0, failed: 0 };
    for (const task of state.tasks) counts[task.bucket || "waiting"] += 1;
    $$("#filterRow [data-count]").forEach((node) => setText(node, String(counts[node.dataset.count] || 0)));
  }

  /* ----------------------------------------------------------------- drawer */
  function openTask(id) {
    state.selectedId = id;
    persistSelected(id);
    // Opening straight on the log is what the modal is for: it is the view you
    // want the moment you click a task, and the container log is the evidence.
    state.tab = "logs";
    $$("#tabs button").forEach((node) => node.classList.toggle("active", node.dataset.tab === "logs"));
    $$(".pane").forEach((node) => { node.hidden = node.id !== `pane-${state.tab}`; });
    $("#scrim").hidden = false;
    document.body.style.overflow = "hidden";
    renderRows();
    loadDetail();
  }

  function closeTask() {
    $("#scrim").hidden = true;
    document.body.style.overflow = "";
    state.selectedId = null;
    state.detail = null;
    state.logKeys = "";
    persistSelected(null);
    stopLogPolling();
    renderRows();
  }

  async function loadDetail() {
    if (!state.selectedId) return;
    try {
      state.detail = await fetchJson(`/api/tasks/${encodeURIComponent(state.selectedId)}`);
      renderDetail();
    } catch (error) {
      toast(`读取任务详情失败：${error.message}`, true);
    }
  }

  function renderDetail() {
    const task = state.detail;
    if (!task) return;
    setText($("#modalTitle"), task.name);
    setHtml($("#modalSub"), [
      task.statusLabel || task.status,
      task.projectCode, task.projectName, task.taskType, task.difficulty, task.taskNo,
      task.repoUrl ? "GitHub 已建库" : "",
      `更新 ${fmtClock(task.updatedAt)}`,
    ].filter(Boolean).map((part) => `<span>${esc(part)}</span>`).join(""));

    const workflow = task.workflow || { steps: [], done: 0, total: 0, percent: 0 };
    const artifacts = task.artifacts || {};
    const artifactTags = [
      ["语义 A", artifacts.semanticA], ["语义 B", artifacts.semanticB], ["证据", artifacts.evidence],
      ["审计", artifacts.audit], ["GSB", artifacts.gsb],
    ].map(([label, ok]) => `<span class="pill" data-state="${ok ? "settled" : "pending"}">${esc(label)} ${ok ? "完成" : "未完成"}</span>`).join("");

    // A/B are markers on a candidate, so there is exactly one list: the
    // candidates, each carrying its mapped letter.  With two candidates they
    // *are* A and B; above two the race decides which two survive.
    const units = task.units || [];
    const mapped = units.filter((unit) => unit.mappedSide).length;
    const candidatePanel = units.length
      ? `<div class="panel" style="margin-top:12px">
           <div class="panel-head">
             <h3>候选${units.length > 2 ? "竞速" : ""} / A · B</h3>
             <span>${units.length} 个候选${units.length > 2 ? ` · ${mapped}/2 已映射 A/B` : mapped ? ` · ${mapped} 个已标记 A/B` : " · 尚未映射"}</span>
           </div>
           <div class="panel-body masonry">${units.map((unit) => renderUnit(task, unit)).join("")}</div>
         </div>`
      : "";

    setHtml($("#pane-overview"), `
      <div class="panel">
        <div class="panel-head"><h3>工作流</h3><span>${workflow.done}/${workflow.total} · ${workflow.percent}%</span></div>
        <div class="panel-body steps">${(workflow.steps || []).map((step) => `
          <div class="step" data-state="${esc(step.state)}">
            <span class="step-i">${step.state === "done" ? "✓" : step.state === "blocked" ? "!" : "·"}</span>
            <div><div class="step-l">${esc(step.label)}</div><div class="step-d">${esc(step.detail)}</div></div>
            <span class="step-s">${esc(step.state === "done" ? "完成" : step.state === "current" ? "进行中" : step.state === "blocked" ? "阻断" : "待办")}</span>
          </div>`).join("")}</div>
      </div>
      <div class="panel" style="margin-top:12px">
        <div class="panel-head"><h3>产物</h3><span>${task.localHead && (task.localHead.A || task.localHead.B) ? `A=${esc((task.localHead.A || "—").slice(0, 8))} B=${esc((task.localHead.B || "—").slice(0, 8))}` : ""}</span></div>
        <div class="panel-body row-inline">${artifactTags}</div>
      </div>
      ${candidatePanel}
      <div class="panel" style="margin-top:12px">
        <div class="panel-head"><h3>路径</h3><span>${esc(task.taskRoot || "")}</span></div>
      </div>
    `);

    setText($("#promptText"), task.promptText || "未读取到提示词文件。");

    renderLogColumns();
    if (state.tab === "logs") startLogPolling();
  }

  function renderUnit(task, unit) {
    const key = unit.key;
    const trace = unit.trace || {};
    const stateKey = unit.active ? "running"
      : ["staged", "clean"].includes(unit.status) ? "done"
      : ["blocked", "attempt_invalid", "invalidated"].includes(unit.status) ? "failed" : "";
    const bars = (unit.stages || []).map((stage) => (
      `<div class="bar-cell ${esc(stage.state)}"><div class="bar"></div><span>${esc(stage.label)}</span></div>`
    )).join("");
    const container = unit.container || {};
    // The mapped letter is the only thing that distinguishes A from B; it is a
    // marker on the candidate, not a separate entity.
    const marker = unit.mappedSide
      ? `<span class="marker" data-side="${esc(unit.mappedSide)}">${esc(unit.mappedSide)}</span>`
      : `<span class="marker none">—</span>`;
    const rank = unit.completionOrder ? `第 ${unit.completionOrder} 名` : "";
    return `
      <section class="side" data-side="${esc(key)}">
        <div class="side-head">
          <div style="display:flex;gap:8px;align-items:flex-start;min-width:0">
            ${marker}
            <div style="min-width:0">
              <div class="side-name">${esc(unit.label)}${rank ? ` <span class="muted">· ${esc(rank)}</span>` : ""}</div>
              <div class="side-phase">${esc(unit.candidateId || unit.key)} · ${esc(unit.phaseDetail || "等待状态")}</div>
            </div>
          </div>
          <span class="pill" data-state="${stateKey === "running" ? "claimed" : stateKey === "done" ? "settled" : stateKey === "failed" ? "refunded" : "pending"}">${esc(STATUS_LABELS[unit.status] || unit.status || "未启动")}</span>
        </div>
        <div class="side-metrics">
          <span>尝试 <b>${esc(unit.attempt ?? "—")}</b></span>
          <span>工具 <b>${esc(trace.toolCalls ?? 0)}</b></span>
          <span>事件 <b>${esc(trace.eventCount ?? 0)}</b></span>
          <span>静默 <b>${esc(unit.silentSeconds === null || unit.silentSeconds === undefined ? "—" : fmtDuration(unit.silentSeconds))}</b></span>
        </div>
        <div class="bars">${bars}</div>
        <dl class="kv">
          <div><dt>容器</dt><dd>${esc(container.name || "无容器")}${container.running ? " · 运行中" : ""}</dd></div>
          <div><dt>Session</dt><dd>${esc(unit.sessionId || "—")}</dd></div>
          <div><dt>最近输出</dt><dd>${esc(trace.lastSummary || trace.lastError || "—")}</dd></div>
          <div><dt>启动于</dt><dd>${esc(fmtClock(unit.startedAt))}</dd></div>
        </dl>
        <div class="row-inline" style="margin-top:10px">
          <button class="btn sm" data-unit-log="${esc(key)}">查看日志</button>
          <button class="btn sm" data-resume="${esc(key)}" ${unit.active ? "disabled" : ""}>续跑</button>
          <button class="btn sm" data-rerun="${esc(key)}" ${unit.active ? "disabled" : ""}>重跑</button>
        </div>
      </section>`;
  }

  /* ------------------------------------------------------------ log polling */
  function logUnits() {
    const units = (state.detail && state.detail.units) || [];
    return units.length ? units : [{ key: "A", label: "A", candidateId: "A" }];
  }
  function logUnitKey(unit, index = 0) {
    return String(unit.key || unit.candidateId || `candidate-${index + 1}`);
  }
  function renderLogColumns() {
    const units = logUnits();
    const keys = units.map(logUnitKey);
    const signature = units.map((unit, index) => (
      [keys[index], unit.mappedSide || "", unit.candidateId || ""].join(":")
    )).join("\u0000");
    if (state.logKeys === signature) return;
    state.logKeys = signature;
    setHtml($("#logStreams"), units.map((unit, index) => {
      const key = keys[index];
      const name = unit.candidateId || unit.key || `candidate-${index + 1}`;
      const marker = unit.mappedSide
        ? `<span class="marker" data-side="${esc(unit.mappedSide)}">${esc(unit.mappedSide)}</span>`
        : `<span class="marker none">—</span>`;
      return `<section class="logcandidate" data-log-candidate="${esc(key)}">
        <div class="logcandidate-head">
          <div class="logcandidate-name" title="${esc(name)}">${marker}<strong>${esc(name)}</strong></div>
          <span class="logcandidate-count" data-log-count="${esc(key)}">等待日志</span>
        </div>
        <div class="logcandidate-path" data-log-path="${esc(key)}">正在定位轨迹…</div>
        <div class="logstream" data-log-stream="${esc(key)}"><div class="empty">等待日志…</div></div>
      </section>`;
    }).join(""));
  }
  function focusLogCandidate(key) {
    const node = $$(".logcandidate").find((item) => item.dataset.logCandidate === String(key));
    if (!node) return;
    node.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    node.classList.add("is-focused");
    setTimeout(() => node.classList.remove("is-focused"), 1600);
  }
  function stopLogPolling() {
    clearInterval(state.logTimer);
    state.logTimer = null;
    state.logSeq += 1;
  }
  function startLogPolling() {
    stopLogPolling();
    refreshLog();
    state.logTimer = setInterval(() => { if (!document.hidden) refreshLog(); }, 3000);
  }

  const KIND_META = {
    system:   { label: "系统",   icon: "·" },
    thinking: { label: "思考",   icon: "◌" },
    assistant:{ label: "输出",   icon: "▸" },
    tool:     { label: "工具",   icon: "⌘" },
    result:   { label: "返回",   icon: "↩" },
    todo:     { label: "待办",   icon: "☑" },
    user:     { label: "输入",   icon: "‹" },
    warning:  { label: "警告",   icon: "!" },
    error:    { label: "错误",   icon: "✕" },
    done:     { label: "结束",   icon: "✓" },
  };

  function renderEvent(event) {
    const kind = String(event.kind || "system");
    const meta = KIND_META[kind] || KIND_META.system;
    const detail = String(event.detail || "");
    // Tool calls and their results are the bulk of a trace; give them a code
    // block so long commands stay readable instead of wrapping into mush.
    const isCode = kind === "tool" || kind === "result";
    return `<div class="ev" data-kind="${esc(kind)}">
      <span class="ev-k" title="${esc(meta.label)}">${esc(meta.icon)}</span>
      <div class="ev-b">
        <div class="ev-t">${esc(event.title || meta.label)}</div>
        ${detail ? `<div class="ev-d${isCode ? " code" : ""}">${esc(detail)}</div>` : ""}
      </div>
    </div>`;
  }

  async function refreshLog() {
    if (!state.selectedId) return;
    renderLogColumns();
    const units = logUnits();
    const streams = new Map($$("[data-log-stream]").map((node) => [node.dataset.logStream, node]));
    const counts = new Map($$("[data-log-count]").map((node) => [node.dataset.logCount, node]));
    const paths = new Map($$("[data-log-path]").map((node) => [node.dataset.logPath, node]));
    const viewports = new Map();
    for (const [key, stream] of streams) {
      viewports.set(key, {
        scrollTop: stream.scrollTop,
        atBottom: stream.scrollHeight - stream.scrollTop - stream.clientHeight < 40,
      });
    }
    const seq = ++state.logSeq;
    try {
      const results = await Promise.all(units.map(async (unit, index) => {
        const key = logUnitKey(unit, index);
        try {
          const data = await fetchJson(
            `/api/tasks/${encodeURIComponent(state.selectedId)}/events`
            + `?side=${encodeURIComponent(key)}&limit=300`, {}, 15000);
          return { key, data, error: null };
        } catch (error) {
          return { key, data: null, error };
        }
      }));
      if (seq !== state.logSeq) return;
      const totals = { all: 0, shown: 0, tool: 0, assistant: 0, error: 0 };
      for (const result of results) {
        const stream = streams.get(result.key);
        if (!stream) continue;
        if (result.error) {
          setHtml(stream, `<div class="empty">事件读取失败：${esc(result.error.message)}</div>`);
          setText(counts.get(result.key), "读取失败");
          continue;
        }
        const all = result.data.events || [];
        const events = state.logKind ? all.filter((event) => event.kind === state.logKind) : all;
        setHtml(stream, events.length
          ? events.map(renderEvent).join("")
          : `<div class="empty">${state.logKind ? "该类型暂无事件。" : "还没有事件。任务启动后会自动刷新。"}</div>`);
        const viewport = viewports.get(result.key);
        stream.scrollTop = viewport && !viewport.atBottom ? viewport.scrollTop : stream.scrollHeight;
        const countsForUnit = {};
        for (const event of all) countsForUnit[event.kind] = (countsForUnit[event.kind] || 0) + 1;
        setText(counts.get(result.key), `${events.length}/${all.length} 条 · 工具 ${countsForUnit.tool || 0} · 输出 ${countsForUnit.assistant || 0} · 错误 ${(countsForUnit.error || 0) + (countsForUnit.warning || 0)}`);
        const path = result.data.path || "未找到轨迹文件";
        const pathNode = paths.get(result.key);
        if (pathNode) {
          setText(pathNode, path.split("/").slice(-3).join("/"));
          setAttr(pathNode, "title", path);
        }
        totals.all += all.length;
        totals.shown += events.length;
        totals.tool += countsForUnit.tool || 0;
        totals.assistant += countsForUnit.assistant || 0;
        totals.error += (countsForUnit.error || 0) + (countsForUnit.warning || 0);
      }
      setText($("#logCount"), `共 ${totals.shown}/${totals.all} 条 · 工具 ${totals.tool} · 输出 ${totals.assistant} · 错误 ${totals.error}`);
      setText($("#logMeta"), `${units.length} 个候选 · 并列同步`);
    } catch (error) {
      if (seq === state.logSeq) setText($("#logMeta"), `事件读取失败：${error.message}`);
    }
  }

  /* ---------------------------------------------------------------- actions */
  async function switchMode() {
    const current = (state.data && (state.data.queue || {}).scheduleMode) || "containers";
    const next = current === "containers" ? "tasks" : "containers";
    try {
      await postJson("/api/automation", { action: "set-schedule-mode", mode: next });
      toast(`调度模式已切换为 ${next === "containers" ? "容器优先" : "任务数量优先"}`);
      applySnapshot(await fetchJson("/api/snapshot"));
    } catch (error) {
      toast(`切换模式失败：${error.message}`, true);
    }
  }

  async function saveFolder() {
    const id = $("#folderSelect").value;
    try {
      const result = await postJson("/api/settings", { settings: { defaultFolderId: id } });
      toast(id ? `默认文件夹已设置为 ${(result.settings || {}).defaultFolderPath || id}` : "已清除默认文件夹");
      applySnapshot(await fetchJson("/api/snapshot"));
    } catch (error) {
      toast(`保存文件夹失败：${error.message}`, true);
      $("#folderSelect").dataset.loaded = "0";
    }
  }

  async function quickDismiss(task) {
    const warning = task.active ? "\n\n该任务当前仍在运行，此操作不会停止现有进程。" : "";
    if (!window.confirm(`从监看列表移除“${task.name}”？${warning}\n\n只从监控列表移除，不删除任务目录、代码、轨迹或产物。`)) return;
    try {
      await postJson("/api/action", { action: "dismiss", taskId: task.id });
      toast(`已移除监看：${task.projectCode || task.name}`);
      if (state.selectedId === task.id) closeTask();
      applySnapshot(await fetchJson("/api/snapshot"));
    } catch (error) {
      toast(`移除失败：${error.message}`, true);
    }
  }

  async function dismissTask() {
    const task = state.detail;
    if (!task) return;
    const warning = task.active ? "\n\n该任务当前仍在运行，此操作不会停止现有进程。" : "";
    if (!window.confirm(`确定放弃监控“${task.name}”？\n\n只会从监控列表移除，不会删除任务目录、代码、轨迹或产物。${warning}`)) return;
    try {
      await postJson("/api/action", { action: "dismiss", taskId: task.id });
      toast(`已放弃监控：${task.projectCode || task.name}`);
      closeTask();
      applySnapshot(await fetchJson("/api/snapshot"));
    } catch (error) {
      toast(`放弃监控失败：${error.message}`, true);
    }
  }

  /* -------------------------------------------------------------- rendering */
  function applySnapshot(payload) {
    state.data = payload;
    state.tasks = payload.tasks || [];
    state.byId = new Map(state.tasks.map((task) => [task.id, task]));
    renderRail({ ...payload, connected: state.connected, error: state.error });
    renderMetrics(payload);
    setText($("#headMeta"), `${payload.tasks.length} 个任务 · ${fmtClock(payload.generatedAt)}`);
    const folder = (payload.folders || []).find((item) => item.id === payload.selectedFolderId);
    setText($("#scopeHint"), folder
      ? `范围：${folder.name} → ${payload.selectedFolderPath || "—"}`
      : `范围：${(payload.activeRoots || []).join(" · ") || "未设置"}`);
    if (!state.selectedId) state.selectedId = selectedIdFromUrl();
    if (state.selectedId && !state.byId.has(state.selectedId)) {
      state.selectedId = state.tasks.find((task) => task.needsAttention)?.id || state.tasks[0]?.id || null;
    }
    renderRows();
    if (state.selectedId && !$("#scrim").hidden) loadDetail();
  }

  function applyDelta(payload) {
    if (!state.data) return;
    const changed = new Map((payload.changed || []).map((task) => [task.id, task]));
    const removed = new Set(payload.removed || []);
    state.tasks = state.tasks.filter((task) => !removed.has(task.id));
    for (const task of changed.values()) state.tasks.push(task);
    state.byId = new Map(state.tasks.map((task) => [task.id, task]));
    if (payload.summary) state.data.summary = payload.summary;
    if (payload.queue) state.data.queue = payload.queue;
    if (payload.containers) state.data.containers = payload.containers;
    state.data.generatedAt = payload.generatedAt;
    renderRail({ ...state.data, connected: state.connected, error: state.error });
    renderMetrics(state.data);
    setText($("#headMeta"), `${state.tasks.length} 个任务 · ${fmtClock(payload.generatedAt)}`);
    renderRows();
  }

  /* ------------------------------------------------------------------- wire */
  $("#searchInput").addEventListener("input", debounce((event) => {
    state.query = event.target.value;
    renderRows();
  }, 150));

  $("#filterRow").addEventListener("click", (event) => {
    const button = event.target.closest("[data-filter]");
    if (!button) return;
    state.filter = button.dataset.filter;
    $$("#filterRow button").forEach((node) => node.classList.toggle("active", node === button));
    renderRows();
  });

  $("#refreshBtn").addEventListener("click", async () => applySnapshot(await fetchJson("/api/snapshot")));
  $("#modeBadge").addEventListener("click", switchMode);
  $("#folderSelect").addEventListener("change", saveFolder);
  $("#closeModalBtn").addEventListener("click", closeTask);
  // The modal is a child of the scrim, so every click inside it bubbles here.
  // Only a click on the scrim itself (the area outside the modal) closes.
  $("#scrim").addEventListener("click", (event) => {
    if (event.target === $("#scrim")) closeTask();
  });
  $("#dismissBtn").addEventListener("click", dismissTask);
  $("#copyPathBtn").addEventListener("click", async () => {
    if (!state.detail) return;
    try { await navigator.clipboard.writeText(state.detail.taskRoot); toast("路径已复制"); }
    catch { toast("复制失败，请手动选择", true); }
  });
  $("#logRefreshBtn").addEventListener("click", refreshLog);

  $("#pane-overview").addEventListener("click", (event) => {
    const jump = event.target.closest("[data-unit-log]");
    if (!jump || !state.detail) return;
    const unit = (state.detail.units || []).find((item) => item.key === jump.dataset.unitLog);
    if (!unit) return;
    state.tab = "logs";
    $$("#tabs button").forEach((node) => node.classList.toggle("active", node.dataset.tab === "logs"));
    $$(".pane").forEach((node) => { node.hidden = node.id !== "pane-logs"; });
    startLogPolling();
    requestAnimationFrame(() => focusLogCandidate(unit.key));
  });

  // One candidate at a time: resuming both at once hides which one actually failed.
  $("#pane-overview").addEventListener("click", async (event) => {
    const button = event.target.closest("[data-resume],[data-rerun]");
    if (!button || button.disabled || !state.selectedId) return;
    const rerun = button.hasAttribute("data-rerun");
    const side = button.dataset.resume || button.dataset.rerun;
    try {
      await postJson("/api/action", { taskId: state.selectedId, side, mode: rerun ? "rerun" : "resume" });
      toast(`已${rerun ? "重跑" : "续跑"} ${side}`);
      await loadDetail();
    } catch (error) {
      toast(`操作失败：${error.message}`, true);
    }
  });
  $("#logKindRow").addEventListener("click", (event) => {
    const button = event.target.closest("[data-kind]");
    if (!button) return;
    state.logKind = button.dataset.kind;
    $$("#logKindRow button").forEach((node) => node.classList.toggle("active", node === button));
    refreshLog();
  });

  $("#tabs").addEventListener("click", (event) => {
    const button = event.target.closest("[data-tab]");
    if (!button) return;
    state.tab = button.dataset.tab;
    $$("#tabs button").forEach((node) => node.classList.toggle("active", node === button));
    $$(".pane").forEach((node) => { node.hidden = node.id !== `pane-${state.tab}`; });
    if (state.tab === "logs") startLogPolling(); else stopLogPolling();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !$("#scrim").hidden) closeTask();
  });

  window.SoloApp.onVisibilityChange((visible) => {
    if (!visible) stopLogPolling();
    else if (state.tab === "logs" && state.selectedId) startLogPolling();
  });

  connectStream({
    onSnapshot: applySnapshot,
    onTasks: applyDelta,
    onLog: () => {},
    onStatus: ({ connected, error }) => {
      state.connected = connected;
      state.error = error;
      if (state.data) renderRail({ ...state.data, connected, error });
    },
  });

  fetchJson("/api/snapshot").then(applySnapshot).catch((error) => {
    state.error = error.message;
    renderRail({ tasks: [], summary: {}, queue: {}, containers: {}, folders: [], connected: false, error: state.error });
    renderMetrics({ summary: {}, queue: {}, containers: {} });
    toast(`初始化失败：${error.message}`, true);
  });
</script>
</body>
</html>
